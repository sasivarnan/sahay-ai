services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay
      POSTGRES_DB: sahay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay -d sahay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
